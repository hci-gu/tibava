services:
  inference_ray:
    image: tibava-cuda-uv:latest
    restart: unless-stopped
    shm_size: "10gb"
    build:
      context: .
      dockerfile: Dockerfile.cuda-uv

    environment:
      HF_HOME: /models
      NLTK_DATA: /models/nltk_data
      HF_HUB_DISABLE_XET: "1"
      HF_TOKEN: ${HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      NUMBA_CACHE_DIR: /root/.cache/numba
      XDG_CACHE_HOME: /root/.cache
      UV_CACHE_DIR: /root/.cache/uv
      PIP_CACHE_DIR: /root/.cache/pip
      TORCH_HOME: /root/.cache/torch
      RAY_DASHBOARD_ADDRESS: http://localhost:52365
      RAY_RUNTIME_ENV_PIP_CACHE_SIZE_GB: "40"
      RAY_RUNTIME_ENV_UV_CACHE_SIZE_GB: "40"
      UV_PYTHON_DOWNLOADS: never
      UV_NO_MANAGED_PYTHON: "1"
      UV_PYTHON: /usr/local/bin/python3.12

    volumes:
      - type: bind
        source: ./data/analyser
        target: /data/
      - type: bind
        source: ./data/media/
        target: /media/
      - type: bind
        source: ./data/models/
        target: /models/
      - type: bind
        source: ./inference_ray
        target: /app/inference_ray
      - type: bind
        source: ./analyser
        target: /app/analyser
      - type: bind
        source: ./backend
        target: /app/backend
      - type: bind
        source: ./packages
        target: /app/packages
      - type: bind
        source: ./pyproject.toml
        target: /app/pyproject.toml
      - type: bind
        source: ./uv.lock
        target: /app/uv.lock
      - type: bind
        source: ./.python-version
        target: /app/.python-version
      - type: volume
        source: workspace_venv
        target: /app/.venv
      - type: volume
        source: python_cache
        target: /root/.cache
      - type: volume
        source: ray_runtime_cache
        target: /var/cache/ray/runtime_resources
      - type: volume
        source: whisperx_env
        target: /opt/whisperx
        read_only: true

    working_dir: /app/

    command: uv run --locked --package inference_ray sh inference_ray/start-cuda-serve.sh

    healthcheck:
      test: ["CMD", ".venv/bin/python", "inference_ray/check-ready.py"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  analyser:
    image: tibava-cuda-uv:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.cuda-uv

    environment:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_MANAGED_PYTHON: "1"
      UV_PYTHON: /usr/local/bin/python3.12

    volumes:
      - type: bind
        source: ./inference_ray
        target: /app/inference_ray
      - type: bind
        source: ./analyser
        target: /app/analyser
      - type: bind
        source: ./backend
        target: /app/backend
      - type: bind
        source: ./packages
        target: /app/packages
      - type: bind
        source: ./data/analyser
        target: /data/
      - type: bind
        source: ./data/media/
        target: /media/
      - type: bind
        source: ./data/cache/
        target: /cache/
      - type: bind
        source: ./pyproject.toml
        target: /app/pyproject.toml
      - type: bind
        source: ./uv.lock
        target: /app/uv.lock
      - type: bind
        source: ./.python-version
        target: /app/.python-version
      - type: volume
        source: workspace_venv
        target: /app/.venv
      - type: volume
        source: python_cache
        target: /root/.cache

    working_dir: /app/

    command: uv run --locked --package analyser analyser/src/analyser/server.py -v -c analyser/config.yml

    depends_on:
      inference_ray:
        condition: service_healthy
      valkey:
        condition: service_started

  postgres:
    image: postgres:14.17
    restart: unless-stopped
    volumes:
      - ./data/db/:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tibava
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  memcached:
    image: memcached:1.6.10-buster
    restart: unless-stopped
    command: -I 32m

  valkey:
    image: valkey/valkey:8.1.1-alpine
    restart: unless-stopped
    command: >-
      /usr/local/bin/valkey-server
      --port 6380
      --bind 0.0.0.0
      --appendonly yes
      --appendfsync everysec
      --dir /data
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:6380:6380"

  celery:
    image: tibava-cuda-uv:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.cuda-uv

    volumes:
      - type: bind
        source: ./inference_ray
        target: /app/inference_ray
      - type: bind
        source: ./analyser
        target: /app/analyser
      - type: bind
        source: ./packages
        target: /app/packages
      - type: bind
        source: ./backend/
        target: /app/backend
      - type: bind
        source: ./data/media/
        target: /media
      - type: bind
        source: ./data/predictions
        target: /predictions
      - type: bind
        source: ./data/backend_cache
        target: /cache
      - type: bind
        source: ./data/tmp
        target: /tmp
      - type: bind
        source: ./pyproject.toml
        target: /app/pyproject.toml
      - type: bind
        source: ./uv.lock
        target: /app/uv.lock
      - type: bind
        source: ./.python-version
        target: /app/.python-version
      - type: volume
        source: workspace_venv
        target: /app/.venv
      - type: volume
        source: python_cache
        target: /root/.cache

    depends_on:
      - postgres

    working_dir: /app/backend/src/backend/
    environment:
      TIBAVA_BACKEND_CONFIG: /app/backend/src/backend/config.json
      UV_PYTHON_DOWNLOADS: never
      UV_NO_MANAGED_PYTHON: "1"
      UV_PYTHON: /usr/local/bin/python3.12
    command: uv run --locked --package backend celery -A tibava worker -l INFO

  backend:
    image: tibava-cuda-uv:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.cuda-uv
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - type: bind
        source: ./inference_ray
        target: /app/inference_ray
      - type: bind
        source: ./analyser
        target: /app/analyser
      - type: bind
        source: ./packages
        target: /app/packages
      - type: bind
        source: ./backend/
        target: /app/backend
      - type: bind
        source: ./data/media/
        target: /media
      - type: bind
        source: ./data/predictions
        target: /predictions
      - type: bind
        source: ./data/backend_cache
        target: /cache
      - type: bind
        source: ./data/tmp
        target: /tmp
      - type: bind
        source: ./pyproject.toml
        target: /app/pyproject.toml
      - type: bind
        source: ./uv.lock
        target: /app/uv.lock
      - type: bind
        source: ./.python-version
        target: /app/.python-version
      - type: volume
        source: workspace_venv
        target: /app/.venv
      - type: volume
        source: python_cache
        target: /root/.cache

    working_dir: /app/
    environment:
      TIBAVA_BACKEND_CONFIG: /app/backend/src/backend/config.json
      UV_PYTHON_DOWNLOADS: never
      UV_NO_MANAGED_PYTHON: "1"
      UV_PYTHON: /usr/local/bin/python3.12
    command: uv run --locked --package backend python3 backend/src/backend/manage.py runserver 0.0.0.0:8000

    depends_on:
      - postgres
      - memcached
      - celery

  frontend:
    image: frontend
    restart: unless-stopped
    expose:
      - "80"
    build:
      context: ./frontend
    volumes:
      - type: bind
        source: ./frontend/
        target: /app/frontend
      - type: bind
        source: ./data/predictions/
        target: /thumbnails
      - type: bind
        source: ./data/media/
        target: /media
    working_dir: /app/frontend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
  valkey_data:
  workspace_venv:
    name: tibava_workspace_venv
    external: true
  python_cache:
    name: tibava_python_cache
    external: true
  ray_runtime_cache:
    name: tibava_ray_runtime_cache
    external: true
  whisperx_env:
    name: tibava_whisperx_env
    external: true
